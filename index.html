<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>snakes and ladders</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <h1>SNAKES AND LADDERS</h1>
      <div class="info">
        <p id="player-position">Player 1: Position 1</p>
        <p id="player2-position">Player 2: Position 1</p>
        <p id="current-turn">Turn: Player 1 🔴</p>
      </div>

      <div class="board"></div>
      <div class="panel">
        <div><button id="roll-dice">🎲 Roll Dice</button></div>
        <div id="dice-result"><img src="images/dice6.png" /></div>
        <div><button id="restart-game">Play Again 🔄</button></div>
      </div>

      <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
      <script src="./script.js"></script>
    </main>
  </body>
</html>
